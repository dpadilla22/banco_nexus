services:
  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: banco-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_NAME: ${DB_NAME:-nexus_banca}
      MONGO_URI: mongodb://mongo-rs:27017,mongo-rs:27018,mongo-rs:27019/${DB_NAME:-nexus_banca}?replicaSet=rsBanco
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es requerido}
      JWT_EXPIRES: ${JWT_EXPIRES:-8h}
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo-rs:
    image: mongo:7
    container_name: banco-mongo-rs
    restart: unless-stopped
    command:
      - bash
      - -lc
      - >
        mkdir -p /data/db1 /data/db2 /data/db3 /data/logs &&
        mongod --replSet rsBanco --bind_ip_all --port 27017 --dbpath /data/db1 --fork --logpath /data/logs/mongo1.log &&
        mongod --replSet rsBanco --bind_ip_all --port 27018 --dbpath /data/db2 --fork --logpath /data/logs/mongo2.log &&
        mongod --replSet rsBanco --bind_ip_all --port 27019 --dbpath /data/db3 --fork --logpath /data/logs/mongo3.log &&
        tail -F /data/logs/mongo1.log /data/logs/mongo2.log /data/logs/mongo3.log
    ports:
      - "27017:27017"
      - "27018:27018"
      - "27019:27019"
    volumes:
      - banco_mongo_rs_data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27017", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  mongo-init:
    image: mongo:7
    container_name: banco-mongo-init
    depends_on:
      mongo-rs:
        condition: service_healthy
    restart: "no"
    command:
      - bash
      - -lc
      - >
        mongosh --host mongo-rs --port 27017 --quiet --eval '
          try {
            rs.status().ok
          } catch (e) {
            rs.initiate({
              _id: "rsBanco",
              members: [
                { _id: 0, host: "mongo-rs:27017" },
                { _id: 1, host: "mongo-rs:27018" },
                { _id: 2, host: "mongo-rs:27019" }
              ]
            }).ok
          }
        '

volumes:
  banco_mongo_rs_data:
